<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Huawei OP DevTools</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: var(--vscode-editor-background);
      }

      .iframe-container {
        width: 100%;
        height: 100vh;
        border: none;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: var(--vscode-foreground);
        font-family: var(--vscode-font-family);
        flex-direction: column;
      }

      .loading-spinner {
        border: 3px solid var(--vscode-input-background);
        border-top: 3px solid var(--vscode-button-background);
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      .error-message {
        color: var(--vscode-errorForeground);
        text-align: center;
        padding: 20px;
      }

      .retry-button {
        margin-top: 10px;
        padding: 8px 16px;
        background-color: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: none;
        border-radius: 2px;
        cursor: pointer;
      }

      .retry-button:hover {
        background-color: var(--vscode-button-hoverBackground);
      }
    </style>
  </head>

  <body>
    <div
      id="loading"
      class="loading"
    >
      <div class="loading-spinner"></div>
      <div>正在加载 Huawei OP DevTools...</div>
    </div>

    <div
      id="error"
      class="loading"
      style="display: none"
    >
      <div class="error-message">
        <h3>加载失败</h3>
        <p id="error-text">无法连接到前端服务，请检查服务状态</p>
        <button
          class="retry-button"
          onclick="retryLoading()"
        >
          重试
        </button>
      </div>
    </div>

    <iframe
      id="opsuiteFrame"
      class="iframe-container"
      src="{{FRONTEND_URL}}"
      style="display: none"
      allow="fullscreen"
      referrerpolicy="no-referrer"
    ></iframe>

    <script>
      const iframe = document.getElementById('opsuiteFrame');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const errorText = document.getElementById('error-text');

      // 最大重试次数
      let retryCount = 0;
      const maxRetries = 3;
      let vscode = null;

      if (typeof acquireVsCodeApi !== 'undefined') {
        vscode = acquireVsCodeApi();
      }

      // 处理iframe加载成功
      iframe.onload = function () {
        console.log('Opsuite loaded successfully');
        loading.style.display = 'none';
        error.style.display = 'none';
        iframe.style.display = 'block';
        retryCount = 0; // 重置重试计数

        // 通知VSCode扩展加载成功
        if (vscode) {
          vscode.postMessage({
            command: 'loaded',
            status: 'success',
          });
        }
      };

      // 处理iframe加载失败
      iframe.onerror = function () {
        console.error('Failed to load Opsuite');
        handleLoadError('无法加载前端界面，请检查服务是否正常启动');
      };

      // 处理加载错误
      function handleLoadError(message) {
        loading.style.display = 'none';
        iframe.style.display = 'none';
        error.style.display = 'flex';
        errorText.textContent = message;

        // 通知VSCode扩展加载失败
        if (vscode) {
          vscode.postMessage({
            command: 'loaded',
            status: 'error',
            message: message,
          });
        }
      }

      // 重试加载
      function retryLoading() {
        if (retryCount >= maxRetries) {
          handleLoadError('已达到最大重试次数，请检查服务状态后重新打开');
          return;
        }

        retryCount++;
        console.log('Retrying load, attempt ' + retryCount);

        loading.style.display = 'flex';
        error.style.display = 'none';
        iframe.style.display = 'none';

        // 重新设置src以触发重新加载
        const currentSrc = iframe.src;
        iframe.src = '';
        setTimeout(() => {
          iframe.src = currentSrc;
        }, 100);
      }

      // 设置超时处理
      const loadTimeout = setTimeout(() => {
        if (loading.style.display !== 'none') {
          handleLoadError('加载超时，请检查网络连接和服务状态');
        }
      }, 15000);

      // 清除超时计时器当页面成功加载时
      iframe.addEventListener('load', function () {
        clearTimeout(loadTimeout);
        loading.style.display = 'none';
        error.style.display = 'none';
        iframe.style.display = 'block';
        retryCount = 0;

        if (vscode) {
          vscode.postMessage({
            command: 'loaded',
            status: 'success',
          });
        }
      });

      // 监听来自VSCode扩展和iframe的消息
      window.addEventListener('message', (event) => {
        const message = event.data;
        console.log('外层页面接收到的message:', message);
        switch (message.command) {
          case 'retry':
            retryLoading();
            break;
          case 'setUrl':
            iframe.src = message.url;
            break;
          case 'updateTheme':
            if (iframe.contentWindow) {
              iframe.contentWindow.postMessage(message, '*');
            }
            break;
        }

        if (message.command.indexOf('vscode') === 0) {
          if (vscode) {
            vscode.postMessage({
              command: message.command,
              message,
            });
          }
        }

        if (message.command.indexOf('iframe') === 0) {
          iframe.contentWindow.postMessage(message, '*');
        }
      });
    </script>
  </body>
</html>

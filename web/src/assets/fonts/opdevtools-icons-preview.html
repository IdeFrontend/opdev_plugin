<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OP DevTools Icons Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1e1e1e;
      --panel: #252526;
      --text: #d4d4d4;
      --muted: #9da3ad;
      --border: #3c3c3c;
      --accent: #4fc1ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 { margin: 0 0 16px; font-size: 20px; font-weight: 600; }
    .note { margin-bottom: 16px; color: var(--muted); font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .item {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    @font-face {
      font-family: "opdevtools-icons";
      src: url("./opdevtools-icons.woff") format("woff");
      font-weight: normal;
      font-style: normal;
    }
    .icon-row {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      font-size: 22px;
      color: var(--accent);
      font-family: "opdevtools-icons";
      font-style: normal;
      font-weight: normal;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .label { font-size: 12px; word-break: break-word; color: var(--text); }
    .code { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <h1>OP DevTools Icon Font Preview</h1>
  <div class="note">Auto-generated by <code>scripts/build-icons-font.mjs</code></div>
  <div id="grid" class="grid"></div>
  <script>
    const icons = [{"name":"beaker","code":"ea01"},{"name":"build","code":"ea02"},{"name":"check","code":"ea03"},{"name":"debug-cpu","code":"ea04"},{"name":"debug-npu","code":"ea05"},{"name":"debug","code":"ea06"},{"name":"flag-filled","code":"ea07"},{"name":"flag-outlined","code":"ea08"},{"name":"group-class-pressed","code":"ea09"},{"name":"group-class","code":"ea0a"},{"name":"group-file-pressed","code":"ea0b"},{"name":"group-file","code":"ea0c"},{"name":"group-severity-error-pressed","code":"ea0d"},{"name":"group-severity-error","code":"ea0e"},{"name":"group-severity-warning-pressed","code":"ea0f"},{"name":"group-severity-warning","code":"ea10"},{"name":"group-type-pressed","code":"ea11"},{"name":"group-type","code":"ea12"},{"name":"onboard","code":"ea13"},{"name":"power","code":"ea14"},{"name":"run","code":"ea15"},{"name":"setting","code":"ea16"},{"name":"sh","code":"ea17"},{"name":"simulation","code":"ea18"},{"name":"tensor","code":"ea19"}];
    const grid = document.getElementById("grid");
    for (const entry of icons) {
      const item = document.createElement("div");
      item.className = "item";

      const icon = document.createElement("div");
      icon.className = "icon-row";
      icon.textContent = String.fromCodePoint(parseInt(entry.code, 16));

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = entry.name;

      const code = document.createElement("div");
      code.className = "code";
      code.textContent = "\\u" + entry.code;

      item.appendChild(icon);
      item.appendChild(label);
      item.appendChild(code);
      grid.appendChild(item);
    }
  </script>
</body>
</html>
